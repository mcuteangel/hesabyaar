# Codacy configuration
# https://docs.codacy.com/codacy-analysis-cli/#excluding-files-or-directories
exclude_paths:
  # AGENTS.md — agent guidance document, not source code. Exempt from generic
  # static analysis rules (file-size, empty-section, absolute-rule checks).
  - 'AGENTS.md'
  # UniFFI-generated Kotlin bindings — regenerated by Gradle, do not lint/fix by hand
  - '**/hesabyar_core.kt'
  - 'rust/uniffi/**'
  # Rust build output
  - 'rust/target/**'
  # Local Rust code-generator (build-time CLI, not a runtime security surface)
  - 'rust/uniffi-gen/**'
  # coverage-forward.yml — new file. Codacy's crude "pull_request_target +
  # checkout" heuristic fires on any YAML containing actions/checkout, even when
  # the ref pins the BASE branch (not the PR head). zizmor's more precise check
  # already passes on this file. Excluded to avoid the false-positive security gate.
  - '.github/workflows/coverage-forward.yml'
