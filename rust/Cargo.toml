[workspace]
resolver = "2"
members = ["hesabyar-core", "uniffi-gen"]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "MIT"
authors = ["Hesabyar Contributors"]

[workspace.dependencies]
uniffi = { version = "0.32", features = ["cli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Lint policy for the whole workspace. Each crate opts in with
# `[lints] workspace = true` in its own Cargo.toml.
#
# Levels:
# - correctness issues deny the build. They mark likely bugs.
# - style, complexity, perf, and suspicious issues warn. They do not block
#   local builds.
# - unwrap_used, expect_used, and panic are restriction lints. Upstream sets
#   them to allow by default. We opt in at warn level so new uses surface in
#   review. Test code may allow them per crate root (see lib.rs).
[workspace.lints.clippy]
all = "warn"
suspicious = "warn"
complexity = "warn"
perf = "warn"
style = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# `too_many_lines` is a pedantic lint (not in `all`). It is the Rust twin of
# detekt `LongMethod`; `clippy.toml` sets `too-many-lines-threshold = 60`.
too_many_lines = "warn"
# `cognitive_complexity` is in `complexity` (already warn). Repeated here so
# the detekt counterpart (`CyclomaticComplexMethod`, threshold 15) is visibly
# wired through `clippy.toml`'s `cognitive-complexity-threshold = 15`.
# Cognitive complexity is an approximate proxy, not the detekt metric itself:
# the two use different formulas, so the shared threshold 15 is a close match.
cognitive_complexity = "warn"
# Restriction lints curated for agent-readability and production hygiene.
# Core code must not log to stdout/stderr (use structured errors or FFI bridge);
# CLI generator crate uniffi-gen allows stdout/stderr explicitly.
print_stdout = "warn"
print_stderr = "warn"
self_named_module_files = "warn"
# priority = 1 applies this group after `all`, so deny wins over the warn above.
correctness = { level = "deny", priority = 1 }
