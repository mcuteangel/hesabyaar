[workspace]
resolver = "2"
members = ["hesabyar-core", "uniffi-gen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Hesabyar Contributors"]

[workspace.dependencies]
uniffi = { version = "0.28", features = ["cli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
