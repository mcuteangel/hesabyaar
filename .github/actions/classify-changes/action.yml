name: Classify changed files
description: >-
  Classify files changed between two refs into change classes
  (kotlin, gradle, rust, site, docs, workflows, actions, ci_scripts, config)
  plus the derived `code` class (kotlin || gradle || rust). Backs the
  smart-gating pattern: a cheap `changes` job runs on every event, heavy
  jobs gate on `needs.changes.outputs.<class> == 'true'`, so required
  status checks still report (as skipped) instead of deadlocking the merge.

inputs:
  base-ref:
    description: Base ref for the diff (PR base SHA, or push event 'before' SHA)
    required: true
  head-ref:
    description: Head ref for the diff
    required: true
  self-path:
    description: Repo-relative path of the caller's own workflow file (enables the `self` output)
    required: false
    default: ''

outputs:
  kotlin:
    description: "true when app/** changed"
    value: ${{ steps.classify.outputs.kotlin }}
  gradle:
    description: "true when Gradle build files changed"
    value: ${{ steps.classify.outputs.gradle }}
  rust:
    description: "true when rust/** changed"
    value: ${{ steps.classify.outputs.rust }}
  site:
    description: "true when site/** changed"
    value: ${{ steps.classify.outputs.site }}
  docs:
    description: "true when docs changed"
    value: ${{ steps.classify.outputs.docs }}
  workflows:
    description: "true when .github/workflows/** changed"
    value: ${{ steps.classify.outputs.workflows }}
  actions:
    description: "true when .github/actions/** changed"
    value: ${{ steps.classify.outputs.actions }}
  ci_scripts:
    description: "true when scripts/** or .github/scripts/** changed"
    value: ${{ steps.classify.outputs.ci_scripts }}
  config:
    description: "true when repo config files changed"
    value: ${{ steps.classify.outputs.config }}
  code:
    description: "true when anything feeding the Android build changed (kotlin || gradle || rust)"
    value: ${{ steps.classify.outputs.code }}
  self:
    description: "true when self-path itself changed (empty self-path always yields false)"
    value: ${{ steps.classify.outputs.self }}

runs:
  using: composite
  steps:
    - id: classify
      shell: bash
      # The script appends KEY=value lines to $GITHUB_OUTPUT itself.
      # Refs travel via env, not template expansion in run: (zizmor
      # template-injection would flag inline ${{ inputs.* }} here).
      env:
        BASE_REF: ${{ inputs.base-ref }}
        HEAD_REF: ${{ inputs.head-ref }}
        SELF_PATH: ${{ inputs.self-path }}
      run: bash "$GITHUB_WORKSPACE/scripts/classify-changes.sh" "$BASE_REF" "$HEAD_REF" "$SELF_PATH"
