---
# Zizmor configuration. Super-Linter passes this file with
# `zizmor --config`, so every rule listed here runs on every pull
# request that touches a workflow.
rules:
  # The composite action appends the verified DeepSource CLI directory
  # to $GITHUB_PATH. The path is fixed, not attacker controlled, and
  # the binary is checksum verified before the entry is written.
  github-env:
    ignore:
      - setup-deepsource-cli/action.yml

  # dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
  # resolves in the upstream repository. The audit cannot confirm this
  # from a shallow checkout, so it reports a false positive.
  impostor-commit:
    ignore:
      - rust-lint.yml:32
      - codspeed-rust.yml:33
