---
# Zizmor configuration. Super-Linter passes this file with
# `zizmor --config`, so every rule listed here runs on every pull
# request that touches a workflow.
rules:
  # dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
  # and the pin in setup-rust-android both resolve in the upstream
  # repository. The audit cannot confirm this from a shallow checkout,
  # so it reports a false positive. Match on file name only because the
  # line numbers move whenever a step is inserted above them.
  impostor-commit:
    ignore:
      - rust-lint.yml
      - codspeed-rust.yml
      - setup-rust-android/action.yml
