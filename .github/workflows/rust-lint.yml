name: Rust Lint

on:
  push:
    branches: [main, "feature/*"]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-lint.yml'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Format, Clippy, Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}
      HAS_COVERALLS_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN != '' }}
      # Single definition of the trusted-run predicate (event, fork, actor);
      # the verify step references this instead of repeating the expression.
      IS_TRUSTED_RUN: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true)) && github.event.repository.fork != true && github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Rust
        # rust-toolchain.toml pins the channel to "stable" and lists clippy
        # and rustfmt as components. The components input keeps them explicit
        # for this job.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "rust"

      - name: Check formatting
        working-directory: rust
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Run tests and generate coverage
        working-directory: rust
        run: cargo llvm-cov nextest --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: rust/lcov.info
          flags: rust
          fail_ci_if_error: false

      - name: Verify Coveralls token on trusted runs
        # The final gate step references this id - do not rename without updating it.
        id: verify-coveralls-token
        # Loud but non-fatal: a missing token must not abort the rest of the
        # job (other coverage reporters, test results, APK build). The final
        # gate step fails the run after everything else has finished.
        # Fork/Dependabot runs skip the upload silently via the if guard below
        # (Dependabot-triggered runs receive no Actions secrets by design).
        continue-on-error: true
        if: ${{ env.IS_TRUSTED_RUN == 'true' && env.HAS_COVERALLS_TOKEN != 'true' }}
        run: |
          echo "::error::COVERALLS_REPO_TOKEN is not configured for trusted runs"
          exit 1

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        # Skip when no token (fork/Dependabot); keep non-fatal so a
        # Coveralls outage/rate-limit never fails the build.
        if: env.HAS_COVERALLS_TOKEN == 'true'
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
          file: rust/lcov.info
          format: lcov
          flag-name: rust
          parallel: true

      - name: Upload coverage to Qlty Cloud
        # Forked-PR runs get no secrets, so the token would be empty.
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
        continue-on-error: true
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: rust/lcov.info
          # No add-prefix: the Qlty CLI resolves SF: paths in rust/lcov.info
          # against the lcov file's own location, which already yields the
          # correct repo-relative rust/... paths. add-prefix produced
          # rust/rust/... and failed validation (issue #294).
          tag: rust

      - name: Prefix LCOV file paths for repository root
        # The coverage command runs for the whole workspace (hesabyar-core
        # plus uniffi-gen), so prefix every workspace-relative SF entry with
        # rust/; entries that already resolve from the repo root stay intact.
        run: |
          sed -e 's|^SF:\([^/]\)|SF:rust/\1|' -e 's|^SF:rust/rust/|SF:rust/|' rust/lcov.info > rust/lcov.prefixed.info

      - name: Run Codacy Coverage Reporter (Rust)
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        continue-on-error: true
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          CODACY_ORGANIZATION_PROVIDER: gh
          CODACY_USERNAME: mcuteangel
          CODACY_PROJECT_NAME: hesabyaar
        with:
          coverage-reports: rust/lcov.prefixed.info

      - name: Set up DeepSource CLI
        id: setup-deepsource
        if: ${{ env.DEEPSOURCE_DSN != '' }}
        continue-on-error: true
        uses: ./.github/actions/setup-deepsource-cli

      - name: Upload coverage to DeepSource
        if: ${{ env.DEEPSOURCE_DSN != '' && steps.setup-deepsource.outcome == 'success' }}
        continue-on-error: true
        env:
          DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}
          # On pull_request events, actions/checkout creates an ephemeral merge commit.
          # Report against the PR head SHA so DeepSource can associate the artifact (#310, #295).
          DEEPSOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          deepsource report --analyzer test-coverage --key rust --commit "$DEEPSOURCE_COMMIT_SHA" --value-file rust/lcov.prefixed.info

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: rust/junit.xml
          fail_ci_if_error: false

      - name: Upload test results to BuildPulse
        if: always()
        uses: BuildPulseLLC/test-reporter-action@329c479061feca84382766b3a342a7368a6d8f4c # v3.1.0
        continue-on-error: true
        with:
          api-token: ${{ secrets.BUILDPULSE_API_TOKEN }}
          path: rust/junit.xml
          coverage-files: rust/lcov.info
      - name: Fail if Coveralls token missing on trusted runs
        # Derives from the verify step's outcome so the trusted-run condition
        # lives in exactly one place; !cancelled() keeps it reporting after
        # step failures without flipping cancelled runs to failure.
        if: ${{ !cancelled() && steps.verify-coveralls-token.outcome == 'failure' }}
        run: |
          echo "::error::COVERALLS_REPO_TOKEN is not configured for trusted runs"
          exit 1
