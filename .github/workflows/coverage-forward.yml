name: Coverage Forward

# Re-reports cached coverage to DeepSource on every PR sync.
#
# Why: coverage uploads live inside smart-gated build jobs. When a job is
# skipped (its file class didn't change), its language key is never reported
# for the PR head SHA, and DeepSource computes the PR aggregate from a
# partial key set - showing bogus drops like "down 45.8% from main" and
# failing the test-coverage check. This workflow restores the newest cached
# report per language (this PR first, then main) and reports it against the
# PR head SHA, so the aggregate is always complete. A language whose files
# didn't change has the same coverage as the base, so forwarding is not a lie.
# Producer jobs still report fresh coverage when they run and overwrite these
# forwarded values. See docs/TEST_COVERAGE.md ("Coverage cache").
#
# Security: this workflow handles the DeepSource DSN, so it runs on
# pull_request_target (the BASE branch's workflow file) and checks out the
# base revision explicitly. No PR-controlled code ever executes with the
# secret in this job. The DSN itself is only ever passed to the trusted
# reporting steps, never exported to the job environment.

on: # zizmor: ignore[dangerous-triggers] -- deliberate secure use: this workflow
  # handles the DeepSource DSN, so pull_request_target runs the BASE branch's
  # workflow file, and the checkout below pins the base revision explicitly.
  # No PR-controlled code ever executes with the secret (see job comment).
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

concurrency:
  # NOTE: github.ref is the base branch under pull_request_target, so the
  # group must key on the PR number to avoid serializing all PRs together.
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  forward:
    name: Forward cached coverage to DeepSource
    # Deliberately NOT gated on changed file classes: a docs-only sync must
    # still re-report the previous results.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Boolean, not the secret: the secrets context cannot be read in step
      # if: conditions, and the DSN value stays scoped to reporting steps.
      HAS_DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN != '' }}
      COVERAGE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request_target already runs this file from the base branch;
          # pin the checkout to the base revision too, so the local actions
          # below resolve to trusted code as well.
          ref: ${{ github.event.pull_request.base.sha }}
          # Nothing is pushed; keep the token out of the git config.
          persist-credentials: false

      - name: Set up DeepSource CLI
        id: setup-deepsource
        if: ${{ env.HAS_DEEPSOURCE_DSN == 'true' }}
        # No continue-on-error here: a setup failure (network, checksum,
        # missing action) must fail the job and surface the problem. The
        # action already retries curl and verifies the checksum. The forward
        # steps below still gate on their own outcome for best-effort
        # reporting when producers overwrite stale data later.
        uses: $/.github/actions/setup-deepsource-cli

      - name: Forward Kotlin coverage
        if: ${{ env.HAS_DEEPSOURCE_DSN == 'true' && steps.setup-deepsource.outcome == 'success' }}
        continue-on-error: true
        uses: $/.github/actions/coverage-cache
        with:
          mode: forward
          language: kotlin
          file: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          commit-sha: ${{ env.COVERAGE_SHA }}
          deepsource-dsn: ${{ secrets.DEEPSOURCE_DSN }}

      - name: Forward Rust coverage
        if: ${{ env.HAS_DEEPSOURCE_DSN == 'true' && steps.setup-deepsource.outcome == 'success' }}
        continue-on-error: true
        uses: $/.github/actions/coverage-cache
        with:
          mode: forward
          language: rust
          file: rust/lcov.prefixed.info
          commit-sha: ${{ env.COVERAGE_SHA }}
          deepsource-dsn: ${{ secrets.DEEPSOURCE_DSN }}
