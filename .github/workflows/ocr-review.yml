# OpenCodeReview - automatic PR review.
# Re-runs on a comment starting with '/open-code-review' or '@open-code-review'.
#
# Set in Settings -> Secrets and variables -> Actions:
#   Variable  OCR_LLM_URL            LLM API endpoint (e.g. https://api.openai.com/v1/chat/completions)
#   Secret    OCR_LLM_AUTH_TOKEN     LLM auth token
#   Variable  OCR_LLM_MODEL          model name
#   Variable  OCR_LLM_USE_ANTHROPIC  'true' for Anthropic models, 'false' otherwise
#
# The Action is pinned to the v1.9.9 release commit, and the OCR npm package
# is pinned to the same release via ocr_version (the Action default is
# 'latest'). On pull_request_target, the Action derives base_ref/head_sha from
# the event payload itself, so no extra API call is needed for that path
# (action.yml "Resolve PR refs" step).
#
# NOTE: the issue_comment authorization predicate below appears twice by
# design - in the concurrency expression and in the job if. GitHub Actions has
# no shared-expression mechanism between the two, and a simpler group would let
# any unrelated comment cancel an in-progress review. Keep both blocks identical.

name: OpenCodeReview PR Review

concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/open-code-review')
            || startsWith(github.event.comment.body, '@open-code-review')
          )
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

on:
  # pull_request_target keeps variables available for fork PRs.
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    steps:
      - name: Get PR context
        id: pr-context
        if: github.event_name == 'issue_comment'
        # v7.1.0 (immutable pin)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const prNumber = context.issue.number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

      - name: Run OpenCodeReview
        # v1.9.9 release commit (immutable pin; tag object c95d3907 dereferences
        # to this commit).
        uses: alibaba/open-code-review@4b6874bd23106b5c68bea6d230bb60303b9f0961
        with:
          # Pin the CLI to the same reviewed release; the Action default is 'latest'.
          ocr_version: '1.9.9'
          llm_url: ${{ vars.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
