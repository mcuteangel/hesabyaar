name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: "!contains(github.event.head_commit.message, '[skip release]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Detect application changes
        id: detect
        env:
          BASE_REF: ${{ github.event.before }}
        run: |
          if bash scripts/detect-changes.sh "$BASE_REF" HEAD; then
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse conventional commits
        if: steps.detect.outputs.release_needed == 'true'
        id: parse
        env:
          BASE_REF: ${{ github.event.before }}
        run: |
          result=$(bash scripts/parse-commits.sh "$BASE_REF" HEAD)
          bump_type=$(echo "$result" | jq -r '.bump_type')
          summary=$(echo "$result" | jq -r '.summary')
          echo "bump_type=$bump_type" >> "$GITHUB_OUTPUT"
          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          echo "$summary" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Bump type: $bump_type"

      - name: Bump version
        if: steps.detect.outputs.release_needed == 'true'
        id: bump
        env:
          BUMP_TYPE: ${{ steps.parse.outputs.bump_type }}
        run: |
          new_version=$(bash scripts/bump-version.sh "$BUMP_TYPE")
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "tag=v${new_version}" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        if: steps.detect.outputs.release_needed == 'true'
        id: check_tag
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          if git rev-parse "v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Rust for Android
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        uses: ./.github/actions/setup-rust-android

      - name: Cache Cargo dependencies
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache Gradle packages
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Setup keystore
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          echo "Keystore decoded successfully"

      - name: Run Rust tests
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        working-directory: rust
        run: cargo test -p hesabyar-core

      - name: Grant execute permission for gradlew
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        run: chmod +x gradlew

      - name: Generate Rust bindings
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        run: ./gradlew :app:generateAndFixBindings

      - name: Run unit tests
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        run: ./gradlew testDebugUnitTest

      - name: Build release APK and AAB
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Generate checksums
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          mkdir -p release-artifacts
          VER="v${NEW_VERSION}"
          # Map Gradle's per-ABI APK names to user-friendly, versioned filenames.
          declare -A ABI_MAP=(
            ["armeabi-v7a"]="arm-v7a"
            ["arm64-v8a"]="arm-v8a"
            ["x86_64"]="x86_64"
            ["universal"]="universal"
          )
          while IFS= read -r src; do
            [ -z "$src" ] && continue
            name=$(basename "$src")
            base="${name#app-}"
            base="${base%-release.apk}"
            abi="${ABI_MAP[$base]:-$base}"
            dst="release-artifacts/hesabyar-${VER}-${abi}.apk"
            cp "$src" "$dst"
            echo "APK: $dst"
          done < <(find app/build/outputs/apk -name "*-release.apk")
          aab_dir="app/build/outputs/bundle/release"
          aab_files=("${aab_dir}"/*.aab)
          if [ -e "${aab_files[0]}" ]; then
            if [ "${#aab_files[@]}" -gt 1 ]; then
              echo "ERROR: multiple AABs produced, destination name collision" >&2
              exit 1
            fi
            cp "${aab_files[0]}" "release-artifacts/hesabyar-${VER}.aab"
            echo "AAB: release-artifacts/hesabyar-${VER}.aab"
          else
            echo "No AAB produced; skipping bundle copy."
          fi
          cd release-artifacts
          for f in *.apk *.aab; do
            if [ -f "$f" ]; then
              sha256sum "$f" > "${f}.sha256"
              echo "Checksum: $f"
            fi
          done

      - name: Generate release notes with AI
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        id: notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          BASE_REF: ${{ github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Heading kept ASCII in-source (base64) to avoid non-ASCII in the workflow;
          # decoded at runtime below. (Persian "previous releases" string.)
          PREV_HEADING_B64: "2YbYs9iu2YfigIzZh9in24wg2YLYqNmE24w="
        run: |
          PREV_HEADING=$(printf '%s' "${PREV_HEADING_B64}" | base64 -d)
          # Current version's notes (used for both the release page and CHANGELOG).
          bash scripts/generate-release-notes.sh "$NEW_VERSION" "$BASE_REF" HEAD > current-notes.md

          # Append descriptions of the last 5 releases from the release page itself.
          prev_section=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            body=$(gh release view "$tag" --json body --jq '.body' 2>/dev/null || echo "")
            [ -z "$body" ] && continue
            # Strip the RTL wrapper and any nested "previous releases" section to avoid recursion.
            body=$(printf '%s' "$body" | sed -e 's#^<div dir="rtl">##' -e 's#</div>$##' | sed "/^## ${PREV_HEADING}/,\$d")
            prev_section="${prev_section}## ${tag}"$'\n'"${body}"$'\n'$'\n'
          done < <(gh release list --limit 5 --json tagName --jq '.[].tagName' 2>/dev/null)

          {
            echo '<div dir="rtl">'
            echo ""
            cat current-notes.md
            echo ""
            if [ -n "$prev_section" ]; then
              echo "## ${PREV_HEADING}"
              echo ""
              printf '%s' "$prev_section"
            fi
            echo ""
            echo '</div>'
          } > release-notes.md
          echo "notes_file=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG with release notes
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          python3 scripts/update-changelog.py "$NEW_VERSION" current-notes.md 5

      - name: Commit version bump
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md
          git commit -m "chore: release v${NEW_VERSION} [skip ci]"
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
          git push origin HEAD --follow-tags

      - name: Create GitHub Release
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION}" \
            --notes-file release-notes.md \
            release-artifacts/*.apk \
            release-artifacts/*.aab \
            release-artifacts/*.sha256

      - name: Upload release artifacts
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: release-v${{ steps.bump.outputs.new_version }}
          path: release-artifacts/
          retention-days: 30

      - name: Cleanup keystore
        if: always() && steps.detect.outputs.release_needed == 'true'
        run: rm -f my-upload-key.jks

      - name: Summary
        if: steps.detect.outputs.release_needed == 'true'
        env:
          TAG_EXISTS: ${{ steps.check_tag.outputs.tag_exists }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          BUMP_TYPE: ${{ steps.parse.outputs.bump_type }}
        run: |
          if [ "$TAG_EXISTS" = "true" ]; then
            echo "### ⏭️ Release skipped" >> $GITHUB_STEP_SUMMARY
            echo "Tag v${NEW_VERSION} already exists." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Release v${NEW_VERSION}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Version | ${NEW_VERSION} |" >> $GITHUB_STEP_SUMMARY
            echo "| Bump type | ${BUMP_TYPE} |" >> $GITHUB_STEP_SUMMARY
            echo "| Tag | v${NEW_VERSION} |" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Summary - Skipped
        if: steps.detect.outputs.release_needed == 'false'
        run: |
          echo "### ⏭️ Release skipped" >> $GITHUB_STEP_SUMMARY
          echo "No application code changes detected." >> $GITHUB_STEP_SUMMARY
