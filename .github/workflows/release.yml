name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect application changes
        id: detect
        run: |
          if bash scripts/detect-changes.sh ${{ github.event.before }} HEAD; then
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse conventional commits
        if: steps.detect.outputs.release_needed == 'true'
        id: parse
        run: |
          result=$(bash scripts/parse-commits.sh ${{ github.event.before }} HEAD)
          bump_type=$(echo "$result" | jq -r '.bump_type')
          summary=$(echo "$result" | jq -r '.summary')
          echo "bump_type=$bump_type" >> "$GITHUB_OUTPUT"
          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          echo "$summary" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Bump type: $bump_type"

      - name: Bump version
        if: steps.detect.outputs.release_needed == 'true'
        id: bump
        run: |
          new_version=$(bash scripts/bump-version.sh ${{ steps.parse.outputs.bump_type }})
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "tag=v${new_version}" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        if: steps.detect.outputs.release_needed == 'true'
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.bump.outputs.new_version }}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Gradle packages
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Setup keystore
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          echo "Keystore decoded successfully"

      - name: Grant execute permission for gradlew
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        run: chmod +x gradlew

      - name: Run unit tests
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build release AAB
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Generate checksums
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        run: |
          mkdir -p release-artifacts
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} release-artifacts/ \;
          find app/build/outputs/bundle/release -name "*.aab" -exec cp {} release-artifacts/ \;
          cd release-artifacts
          for f in *.apk *.aab; do
            if [ -f "$f" ]; then
              sha256sum "$f" > "${f}.sha256"
              echo "Checksum: $f"
            fi
          done

      - name: Generate release notes with AI
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        id: notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          bash scripts/generate-release-notes.sh "${{ steps.bump.outputs.new_version }}" "${{ github.event.before }}" HEAD > release-notes.md
          echo "notes_file=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md app/build.gradle.kts
          git commit -m "chore: release v${{ steps.bump.outputs.new_version }} [skip ci]"
          git tag -a "v${{ steps.bump.outputs.new_version }}" -m "Release v${{ steps.bump.outputs.new_version }}"
          git push origin HEAD --follow-tags

      - name: Create GitHub Release
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.new_version }}" \
            --title "v${{ steps.bump.outputs.new_version }}" \
            --notes-file release-notes.md \
            release-artifacts/*.apk \
            release-artifacts/*.aab \
            release-artifacts/*.sha256

      - name: Upload release artifacts
        if: steps.detect.outputs.release_needed == 'true' && steps.check_tag.outputs.tag_exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: release-v${{ steps.bump.outputs.new_version }}
          path: release-artifacts/
          retention-days: 30

      - name: Cleanup keystore
        if: always() && steps.detect.outputs.release_needed == 'true'
        run: rm -f my-upload-key.jks

      - name: Summary
        if: steps.detect.outputs.release_needed == 'true'
        run: |
          if [ "${{ steps.check_tag.outputs.tag_exists }}" = "true" ]; then
            echo "### ⏭️ Release skipped" >> $GITHUB_STEP_SUMMARY
            echo "Tag v${{ steps.bump.outputs.new_version }} already exists." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Release v${{ steps.bump.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Version | ${{ steps.bump.outputs.new_version }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Bump type | ${{ steps.parse.outputs.bump_type }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Tag | v${{ steps.bump.outputs.new_version }} |" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Summary - Skipped
        if: steps.detect.outputs.release_needed == 'false'
        run: |
          echo "### ⏭️ Release skipped" >> $GITHUB_STEP_SUMMARY
          echo "No application code changes detected." >> $GITHUB_STEP_SUMMARY
