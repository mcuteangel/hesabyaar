name: Lint GitHub Actions

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  actionlint:
    name: Run actionlint
    runs-on: ubuntu-latest
    env:
      HAS_DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN != '' }}
      HAS_COVERALLS_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN != '' }}
      # Single definition of the trusted-run predicate (event, fork, actor);
      # the verify step references this instead of repeating the expression.
      IS_TRUSTED_RUN: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true)) && github.event.repository.fork != true && github.actor != 'dependabot[bot]' }}
    permissions:
      # Read repository content. Report lint results through the Checks API.
      contents: read
      checks: write
    steps:
       - name: Checkout
         uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
         with:
          persist-credentials: false

       - name: Run actionlint via reviewdog
         uses: reviewdog/action-actionlint@1758727be30241166609dad4c97588b6ad411f32 # v1.79.1
         with:
          # این فلگ خطاهای مربوط به shellcheck را مخفی می‌کند مگر اینکه در سطح error باشند
          actionlint_flags: -shellcheck=

       - name: Run issue auto-close regression tests
         run: bash scripts/test-issue-autoclose.sh

       - name: Run Actions pin manager tests
         run: node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=junit-pin-manager.xml --test-reporter=lcov --test-reporter-destination=coverage-pin-manager.lcov scripts/test-github-actions-pin-manager.mjs

       - name: Run change-detection regression tests
         run: bash scripts/tests/test-detect-changes.sh

       - name: Run parse-commits regression tests
         run: bash scripts/tests/test-parse-commits.sh

       - name: Run release-notes regression tests
         run: bash scripts/tests/test-generate-release-notes.sh

       - name: Upload script coverage to Codecov
         uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
         with:
           token: ${{ secrets.CODECOV_TOKEN }}
           files: coverage-pin-manager.lcov
           flags: scripts
           fail_ci_if_error: false

       - name: Verify Coveralls token on trusted runs
         # The final gate step references this id - do not rename without updating it.
         id: verify-coveralls-token
         # Loud but non-fatal: a missing token must not abort the rest of the
         # job (other coverage reporters, test results, APK build). The final
         # gate step fails the run after everything else has finished.
         # Fork/Dependabot runs skip the upload silently via the if guard below
         # (Dependabot-triggered runs receive no Actions secrets by design).
         continue-on-error: true
         if: ${{ env.IS_TRUSTED_RUN == 'true' && env.HAS_COVERALLS_TOKEN != 'true' }}
         run: |
           echo "::error::COVERALLS_REPO_TOKEN is not configured for trusted runs"
           exit 1

       - name: Upload coverage to Coveralls
         uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
         # Skip when no token (fork/Dependabot); keep non-fatal so a
         # Coveralls outage/rate-limit never fails the build.
         if: env.HAS_COVERALLS_TOKEN == 'true'
         continue-on-error: true
         with:
           github-token: ${{ secrets.GITHUB_TOKEN }}
           repo-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
           file: coverage-pin-manager.lcov
           format: lcov
           flag-name: scripts
           parallel: true

       - name: Upload coverage to Qlty Cloud
         # Forked-PR runs get no secrets, so the token would be empty.
         if: ${{ !github.event.pull_request.head.repo.fork }}
         uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
         continue-on-error: true
         with:
           token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
           files: coverage-pin-manager.lcov
           tag: scripts

       - name: Set up DeepSource CLI
         id: setup-deepsource
         if: ${{ env.HAS_DEEPSOURCE_DSN == 'true' }}
         continue-on-error: true
         uses: ./.github/actions/setup-deepsource-cli

       - name: Upload coverage to DeepSource
         if: ${{ env.HAS_DEEPSOURCE_DSN == 'true' && steps.setup-deepsource.outcome == 'success' }}
         continue-on-error: true
         env:
           DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}
           # On pull_request events, actions/checkout creates an ephemeral merge commit.
           # Report against the PR head SHA so DeepSource can associate the artifact (#310).
           DEEPSOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
         run: |
           deepsource report --analyzer test-coverage --key javascript --commit "$DEEPSOURCE_COMMIT_SHA" --value-file coverage-pin-manager.lcov

       - name: Upload test results to Codecov
         if: ${{ !cancelled() }}
         uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
         continue-on-error: true
         with:
           token: ${{ secrets.CODECOV_TOKEN }}
           files: junit-pin-manager.xml
           fail_ci_if_error: false

       - name: Upload test results to BuildPulse
         if: always()
         uses: BuildPulseLLC/test-reporter-action@329c479061feca84382766b3a342a7368a6d8f4c # v3.1.0
         continue-on-error: true
         with:
           api-token: ${{ secrets.BUILDPULSE_API_TOKEN }}
           path: junit-pin-manager.xml
           coverage-files: coverage-pin-manager.lcov

       - name: Run Actions pin audit
         # Informational. The audit never fails CI on its findings; it
         # prints the compliance state of every uses: reference. A crash in
         # the tool must not block unrelated workflow changes either.
         continue-on-error: true
         run: node scripts/github-actions-pin-manager.mjs
       - name: Fail if Coveralls token missing on trusted runs
         # Derives from the verify step's outcome so the trusted-run condition
         # lives in exactly one place; !cancelled() keeps it reporting after
         # step failures without flipping cancelled runs to failure.
         if: ${{ !cancelled() && steps.verify-coveralls-token.outcome == 'failure' }}
         run: |
           echo "::error::COVERALLS_REPO_TOKEN is not configured for trusted runs"
           exit 1
