name: Android CI

on:
  push:
    branches: [main, "feature/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}
      HAS_COVERALLS_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN != '' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Rust for Android
        uses: ./.github/actions/setup-rust-android

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache Gradle packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run Rust tests
        working-directory: rust
        run: cargo test -p hesabyar-core

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Rust bindings
        run: ./gradlew :app:generateAndFixBindings

      - name: Compile Rust core (Android .so)
        # Builds libhesabyar_core.so for every ABI into src/main/jniLibs.
        # Implicitly wired into KotlinCompile via app/build.gradle.kts, so any
        # gradle task that compiles Kotlin (testDebugUnitTest, assembleDebug)
        # also triggers this when Rust sources change.
        run: ./gradlew :app:compileRustCore

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Run detekt
        run: ./gradlew detekt

      - name: Run Unit Tests with Coverage (including Rust-bridge JNI)
        # Name the test tasks explicitly: if the dependsOn chain in
        # gradle/jacoco-coverage.gradle.kts breaks, this step still fails
        # instead of publishing a report from stale exec files.
        # Gradle runs each task once per invocation (no duplicate work).
        run: ./gradlew :app:testDebugUnitTest :app:testDebugUnitTestRust :app:jacocoTestReport

      - name: Assert coverage report exists
        run: test -s app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

      - name: Run Codacy Coverage Reporter
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        continue-on-error: true
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          CODACY_ORGANIZATION_PROVIDER: gh
          CODACY_USERNAME: mcuteangel
          CODACY_PROJECT_NAME: hesabyaar
        with:
          coverage-reports: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          flags: android
          fail_ci_if_error: false

      - name: Verify Coveralls token on trusted runs
        # The final gate step references this id - do not rename without updating it.
        id: verify-coveralls-token
        # Loud but non-fatal: a missing token must not abort the rest of the
        # job (other coverage reporters, test results, APK build). The final
        # gate step fails the run after everything else has finished.
        # Fork/Dependabot runs skip the upload silently via the if guard below
        # (Dependabot-triggered runs receive no Actions secrets by design).
        continue-on-error: true
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true)) && github.event.repository.fork != true && github.actor != 'dependabot[bot]' && env.HAS_COVERALLS_TOKEN != 'true' }}
        run: |
          echo "::error::COVERALLS_REPO_TOKEN is not configured for trusted runs"
          exit 1

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        # Skip when no token (fork/Dependabot); keep non-fatal so a
        # Coveralls outage/rate-limit never fails the build.
        if: env.HAS_COVERALLS_TOKEN == 'true'
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
          file: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          format: jacoco
          base-path: app/src/main/java
          flag-name: android
          parallel: true

      - name: Upload coverage to Qlty Cloud
        # Forked-PR runs get no secrets, so the token would be empty.
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
        continue-on-error: true
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          add-prefix: app/src/main/java
          # Each workflow uploads a different part of the repo and they run on
          # different path filters; tags keep them from replacing each other.
          tag: android

      - name: Set up DeepSource CLI
        id: setup-deepsource
        if: ${{ env.DEEPSOURCE_DSN != '' }}
        continue-on-error: true
        uses: ./.github/actions/setup-deepsource-cli

      - name: Upload coverage to DeepSource
        if: ${{ env.DEEPSOURCE_DSN != '' && steps.setup-deepsource.outcome == 'success' }}
        continue-on-error: true
        env:
          DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}
          # On pull_request events, actions/checkout creates an ephemeral merge commit.
          # Report against the PR head SHA so DeepSource can associate the artifact (#310, #295).
          DEEPSOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          deepsource report --analyzer test-coverage --key kotlin --commit "$DEEPSOURCE_COMMIT_SHA" --value-file app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/build/test-results/**/*.xml
          fail_ci_if_error: false

      - name: Upload test results to BuildPulse
        if: always()
        uses: BuildPulseLLC/test-reporter-action@329c479061feca84382766b3a342a7368a6d8f4c # v3.1.0
        continue-on-error: true
        with:
          api-token: ${{ secrets.BUILDPULSE_API_TOKEN }}
          path: app/build/test-results
          coverage-files: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Fail if Coveralls token missing on trusted runs
        # Derives from the verify step's outcome so the trusted-run condition
        # lives in exactly one place; !cancelled() keeps it reporting after
        # step failures without flipping cancelled runs to failure.
        if: ${{ !cancelled() && steps.verify-coveralls-token.outcome == 'failure' }}
        run: |
          echo "::error::COVERALLS_REPO_TOKEN is not configured for trusted runs"
          exit 1
