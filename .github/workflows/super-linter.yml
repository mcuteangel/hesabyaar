name: Super Linter

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Super-Linter runs many linters in parallel. Each one needs room.
jobs:
  changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kotlin: ${{ steps.classify.outputs.kotlin }}
      gradle: ${{ steps.classify.outputs.gradle }}
      rust: ${{ steps.classify.outputs.rust }}
      site: ${{ steps.classify.outputs.site }}
      docs: ${{ steps.classify.outputs.docs }}
      workflows: ${{ steps.classify.outputs.workflows }}
      actions: ${{ steps.classify.outputs.actions }}
      ci_scripts: ${{ steps.classify.outputs.ci_scripts }}
      config: ${{ steps.classify.outputs.config }}
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        uses: ./.github/actions/classify-changes
        with:
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head-ref: ${{ github.sha }}
  super-linter:
    name: Run Super-Linter
    needs: [changes]
    # Merge-gate: lint only when CI files changed. Skipped still satisfies
    # required status checks.
    if: ${{ needs.changes.outputs.actions == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.ci_scripts == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Clone the repository.
      contents: read
      # Report the result as a commit status check.
      statuses: write
      # Post the summary comment on the pull request.
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Super-Linter needs the full history to find changed files.
          fetch-depth: 0
          persist-credentials: false

      - name: Super-Linter
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Check only the files this pull request changes. The default
          # scans the whole repository on every run.
          VALIDATE_ALL_CODEBASE: false

          # Enabling any VALIDATE_ flag turns every unlisted linter off.
          # Each entry below is a deliberate choice for this repository.
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true
          VALIDATE_YAML: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: true
          VALIDATE_GITLEAKS: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_CLANG_FORMAT: true

          # The repository documents in Persian. The markdown linter
          # reports false line-length errors on right-to-left text, so
          # exclude Markdown files from this workflow. Workflow files
          # stay linted through VALIDATE_GITHUB_ACTIONS below.
          FILTER_REGEX_EXCLUDE: '.*\.md'

          # Report a job summary table instead of a large PR comment.
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: true
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          LOG_LEVEL: 'NOTICE'
