name: PR Title Check

# Enforces the conventional-commit title shape (type[(scope)][!]: subject):
# malformed titles fail the check. The automatic version bump
# (scripts/parse-commits.sh) is driven by the branch's COMMIT SUBJECTS, not
# the title, so a second step lists them via the API and warns on `feat`
# subjects (minor bump). See docs/agents/pr-conventions.md and
# scripts/new-pr.sh.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -eu
          # Mergify's merge-queue drafts have synthetic titles
          # ("merge queue: checking #NNN on main (...)"); the original PR
          # was already title-checked and the draft itself is never merged.
          # Gated on draft status too, so a non-draft mergify[bot] PR still
          # gets its title validated.
          if [ "$PR_AUTHOR" = "mergify[bot]" ] && [ "$PR_DRAFT" = "true" ]; then
            echo "Merge-queue draft PR; skipping title check."
            exit 0
          fi
          # $PR_TITLE is untrusted input: strip newlines so a crafted title
          # cannot inject ::error/::warning workflow commands into the log.
          PR_TITLE=$(printf '%s' "$PR_TITLE" | tr -d '\n\r')
          if ! printf '%s' "$PR_TITLE" | grep -Eq '^(feat|fix|refactor|style|perf|test|docs|chore|build|ci)(\([^)]*\))?(!)?: [^[:space:]]'; then
            echo "::error title=pr-title::PR title must look like 'type[(scope)][!]: subject' (got: $PR_TITLE)"
            echo "See docs/agents/pr-conventions.md and scripts/new-pr.sh."
            exit 1
          fi
          title_type=$(printf '%s' "$PR_TITLE" | sed -E 's/^([a-z]+).*/\1/')
          if [ "$title_type" = "feat" ]; then
            echo "::warning title=pr-title::A 'feat' title should match feat commit subjects on the branch; the subjects (not the title) drive the MINOR version bump (scripts/parse-commits.sh). Reserve 'feat' for user-facing new features; use refactor(...)/style(...) for design-system work. See docs/agents/pr-conventions.md."
          fi
          echo "PR title OK: $PR_TITLE"

      - name: Warn on feat commit subjects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Commit subjects on the PR branch via the API -- the same source
          # scripts/parse-commits.sh reads, minus the `Merge ` subjects it
          # skips. Warning only (never fail): the release workflow decides
          # the bump, not this check. An API failure must not look like
          # "no feat subjects", so it gets its own warning instead.
          subjects=""
          if ! subjects=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" \
            --paginate --jq '.[].commit.message | split("\n")[0]'); then
            echo "::warning title=pr-commits::Could not list PR commits via the GitHub API; skipping the feat-subject check."
            subjects=""
          fi
          feat_subjects=$(printf '%s\n' "$subjects" | grep -v '^Merge ' | grep -E '^feat(\([^)]*\))?:' || true)
          if [ -n "$feat_subjects" ]; then
            printf '%s\n' "$feat_subjects" | while IFS= read -r s; do
              echo "::warning title=pr-commits::feat commit subject bumps MINOR (scripts/parse-commits.sh): $s"
            done
            echo "Reserve 'feat' for user-facing new features; use refactor(...)/style(...) for design-system work. See docs/agents/pr-conventions.md."
          else
            echo "No feat commit subjects on the branch."
          fi
