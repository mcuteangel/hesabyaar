name: Coveralls Parallel Finish

# Finalizes Coveralls parallel builds. The four workflows below each upload
# coverage with `parallel: true`; Coveralls waits for this webhook before
# combining them into a single build. Without it, each upload overwrites the
# previous one and the badge shows only the last-finishing job (Kotlin, ~40%).

on:
  workflow_run:
    workflows: ["Android CI", "Rust Lint", "Lint GitHub Actions", "OCR Resolver Tests"]
    types: [completed]

permissions:
  actions: read

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether all coverage workflows for this commit are done
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Only consider the four coverage-uploading workflows; ignore this
          # finisher's own run and unrelated workflows (linter, benchmarks, …),
          # whose completion does not re-trigger this workflow.
          QUERY='.workflow_runs
            | map(select(.name != "Coveralls Parallel Finish"
              and (.name == "Android CI" or .name == "Rust Lint"
                or .name == "Lint GitHub Actions" or .name == "OCR Resolver Tests")))
            | map(select(.status == "in_progress" or .status == "queued"))
            | length'
          IN_FLIGHT=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$HEAD_SHA&per_page=30" --jq "$QUERY")
          if [ "$IN_FLIGHT" != "0" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Coverage workflows still running for $HEAD_SHA ($IN_FLIGHT in flight); waiting for their workflow_run events."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "All coverage workflows done for $HEAD_SHA; finalizing Coveralls parallel build."
          fi

      - name: Send Coveralls parallel-finished webhook
        if: steps.check.outputs.ready == 'true'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
