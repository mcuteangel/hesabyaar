name: Coveralls Parallel Finish

# Finalizes Coveralls parallel builds. The four workflows below each upload
# coverage with `parallel: true`; Coveralls waits for this webhook before
# combining them into a single build. Without it, each upload overwrites the
# previous one and the badge shows only the last-finishing job (Kotlin, ~40%).
#
# NOTE: the workflow names in `on.workflow_run.workflows` must match the
# WORKFLOWS list in the gate step; renaming a workflow's `name:` requires
# updating both places.

# This workflow never checks out code; it only reads workflow-run statuses
# via the API and sends the Coveralls webhook, so workflow_run cannot
# execute untrusted PR code.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Android CI", "Rust Lint", "Lint GitHub Actions", "OCR Resolver Tests"]
    types: [completed]
    branches: [main]

# Two finisher runs for the same commit must not cancel each other mid-webhook;
# a duplicate parallel-finished call is harmless, a cancelled one leaves the
# build open.
concurrency:
  group: coveralls-finish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  actions: read

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether coverage uploads for this commit are done
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          # Single source of truth for the coverage-uploading workflow names.
          WORKFLOWS_JSON='["Android CI","Rust Lint","Lint GitHub Actions","OCR Resolver Tests"]'
          # Paginate through all runs for this commit; a single page can miss
          # an in-flight run on a busy commit.
          COVERAGE_RUNS=$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&per_page=100" \
            --paginate | jq -s --argjson names "$WORKFLOWS_JSON" \
            '[.[].workflow_runs[] | select(.name as $n | $names | index($n))]')
          # Any non-terminal run means its upload may still be in flight; its
          # completion re-triggers this workflow. (Valid API statuses:
          # queued, in_progress, completed, requested, waiting, pending.)
          IN_FLIGHT=$(echo "$COVERAGE_RUNS" | jq '[.[] | select(.status != "completed")] | length')
          if [ "$IN_FLIGHT" != "0" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Coverage workflows still running for $HEAD_SHA ($IN_FLIGHT in flight); waiting for their workflow_run events."
            exit 0
          fi
          # Finalize when at least one coverage workflow succeeded. The other
          # three are path-filtered and often don't run at all for a given
          # push — requiring all four would leave most builds unfinalized.
          # A failed upload step still yields conclusion=success
          # (continue-on-error), so this is best-effort, not a proof of upload.
          SUCCEEDED=$(echo "$COVERAGE_RUNS" | jq '[.[] | select(.conclusion == "success")] | length')
          if [ "$SUCCEEDED" = "0" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No successful coverage workflow for $HEAD_SHA; not finalizing."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Coverage uploads done for $HEAD_SHA ($SUCCEEDED succeeded); finalizing Coveralls parallel build."

      - name: Send Coveralls parallel-finished webhook
        if: steps.check.outputs.ready == 'true'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
          parallel-finished: true
