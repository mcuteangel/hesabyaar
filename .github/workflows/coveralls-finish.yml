name: Coveralls Parallel Finish

# Finalizes Coveralls parallel builds. The four workflows below each upload
# coverage with `parallel: true`; Coveralls waits for this webhook before
# combining them into a single build. Without it, each upload overwrites the
# previous one and the badge shows only the last-finishing job (Kotlin, ~40%).
#
# NOTE: the workflow names in `on.workflow_run.workflows` must match the
# WORKFLOWS list in the gate step; renaming a workflow's `name:` requires
# updating both places.

on:
  workflow_run:
    workflows: ["Android CI", "Rust Lint", "Lint GitHub Actions", "OCR Resolver Tests"]
    types: [completed]
    branches: [main]

# Two finisher runs for the same commit must not cancel each other mid-webhook;
# a duplicate parallel-finished call is harmless, a cancelled one leaves the
# build open.
concurrency:
  group: coveralls-finish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  actions: read

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether coverage uploads for this commit are done
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          # Single source of truth: workflow name -> Coveralls flag name.
          WORKFLOWS_JSON='[["Android CI","android"],["Rust Lint","rust"],["Lint GitHub Actions","scripts"],["OCR Resolver Tests","ocr-scripts"]]'
          # Paginate through all runs for this commit; a single page can miss
          # an in-flight run on a busy commit.
          COVERAGE_RUNS=$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&per_page=100" \
            --paginate | jq -s --argjson pairs "$WORKFLOWS_JSON" \
            '[.[].workflow_runs[] | select(.name as $n | $pairs | map(.[0]) | index($n))]')
          # Any non-terminal run means its upload may still be in flight; its
          # completion re-triggers this workflow. (Valid API statuses:
          # queued, in_progress, completed, requested, waiting, pending.)
          IN_FLIGHT=$(echo "$COVERAGE_RUNS" | jq '[.[] | select(.status != "completed")] | length')
          if [ "$IN_FLIGHT" != "0" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Coverage workflows still running for $HEAD_SHA ($IN_FLIGHT in flight); waiting for their workflow_run events."
            exit 0
          fi
          # For each uploader: if it never ran (path filter), its flag is
          # carried forward from the previous build so the badge stays stable.
          # If it ran, require a success; a failure/timed_out blocks until a
          # re-run succeeds. A pure-cancelled run means a newer push superseded
          # it, so treat it as absent (the new commit's runs will finalize).
          CARRYFORWARD=""
          while IFS=$'\t' read -r wf flag; do
            RAN=$(echo "$COVERAGE_RUNS" | jq --arg wf "$wf" '[.[] | select(.name == $wf)] | length')
            if [ "$RAN" = "0" ]; then
              echo "Workflow '$wf' did not run for $HEAD_SHA; carrying forward flag '$flag'."
              CARRYFORWARD="${CARRYFORWARD:+$CARRYFORWARD,}$flag"
              continue
            fi
            OK=$(echo "$COVERAGE_RUNS" | jq --arg wf "$wf" '[.[] | select(.name == $wf and .conclusion == "success")] | length')
            if [ "$OK" != "0" ]; then
              continue
            fi
            CANCELLED=$(echo "$COVERAGE_RUNS" | jq --arg wf "$wf" '[.[] | select(.name == $wf and .conclusion == "cancelled")] | length')
            if [ "$CANCELLED" = "$RAN" ]; then
              echo "Workflow '$wf' was cancelled (superseded); carrying forward flag '$flag'."
              CARRYFORWARD="${CARRYFORWARD:+$CARRYFORWARD,}$flag"
              continue
            fi
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Workflow '$wf' ran but did not succeed for $HEAD_SHA; not finalizing."
            exit 0
          done < <(echo "$WORKFLOWS_JSON" | jq -r '.[] | "\(.[0])\t\(.[1])"')
          echo "carryforward=$CARRYFORWARD" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "All triggered coverage workflows succeeded for $HEAD_SHA; finalizing (carryforward: ${CARRYFORWARD:-none})."

      - name: Send Coveralls parallel-finished webhook
        if: steps.check.outputs.ready == 'true'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
          parallel-finished: true
          carryforward: ${{ steps.check.outputs.carryforward }}
