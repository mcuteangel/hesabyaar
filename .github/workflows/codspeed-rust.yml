name: CodSpeed Benchmarks (Rust)

on:
  push:
    branches: [main]
  pull_request:
  # Allow running the benchmarks manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read # required for actions/checkout
  # NOTE: id-token: write lives on the benchmarks job only (needed for
  # CodSpeed OIDC auth). Keeping it off the workflow level means the
  # changes job (which checks out PR-head code) never inherits it.


concurrency:
  # Manual dispatches get their own group: sharing github.ref with push
  # runs would let every push to main cancel an in-progress ~2-hour
  # benchmark run (and vice versa).
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || github.ref }}
  cancel-in-progress: true


jobs:
  changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      kotlin: ${{ steps.classify.outputs.kotlin }}
      gradle: ${{ steps.classify.outputs.gradle }}
      rust: ${{ steps.classify.outputs.rust }}
      site: ${{ steps.classify.outputs.site }}
      docs: ${{ steps.classify.outputs.docs }}
      workflows: ${{ steps.classify.outputs.workflows }}
      actions: ${{ steps.classify.outputs.actions }}
      ci_scripts: ${{ steps.classify.outputs.ci_scripts }}
      config: ${{ steps.classify.outputs.config }}
      code: ${{ steps.classify.outputs.code }}
      self: ${{ steps.classify.outputs.self }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        uses: ./.github/actions/classify-changes
        with:
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head-ref: ${{ github.sha }}
          self-path: .github/workflows/codspeed-rust.yml
  benchmarks:
    name: Run Rust benchmarks
    runs-on: ubuntu-latest
    # Budget: 3 attempts x 30m per-attempt cap (+2m SIGKILL grace each if the
    # process ignores TERM), two 30s inter-attempt sleeps, and setup
    # (checkout, Rust toolchain, benchmark build; a cold cargo-codspeed
    # install adds ~10-20m). A late transient failure (e.g. an upload error
    # after the benchmarks finish) must leave room for a full retry instead
    # of dying on the job timeout with a generic error.
    timeout-minutes: 120
    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    # `id-token: write` (needed for CodSpeed OIDC auth) is stripped by GitHub on
    # pull requests from forked repositories, which would make this job fail.
    # Only run on pushes and same-repo PRs; community-fork PRs skip benchmarking.
    needs: [changes]
    # Fail-open: run when the classifier job did NOT succeed, so a broken
    # classifier can never silently skip the benchmarks. NOTE: the explicit
    # !cancelled() is load-bearing - without a status-check function GitHub
    # wraps job-level if: in implicit success().
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      (needs.changes.result != 'success' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.actions == 'true' ||
      needs.changes.outputs.self == 'true')
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Cache cargo-codspeed binary
        id: cache
        # `cargo install` compiles from source on every run. Cache the installed
        # binary (keyed on version) so CI doesn't recompile the tool each time.
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cargo/bin/cargo-codspeed
          key: cargo-codspeed-5.0.1 # gitleaks:allow

      - name: Install lld linker
        run: sudo apt-get update && DEBIAN_FRONTEND=noninteractive sudo apt-get install -y lld

      - name: Install cargo-codspeed
        # cargo-codspeed sets CODSPEED_CARGO_WORKSPACE_ROOT and instruments the
        # shim. Without it, cargo bench panics with the NotPresent env error.
        # Pinned + --locked for reproducible installs; skipped when cached.
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install cargo-codspeed --version 5.0.1 --locked

      - name: Run benchmarks
        uses: CodSpeedHQ/action@c4fd08a3a159bd0cc208da1e0edf32b8c47d75e5 # v5.4.0
        env:
            # ERE (case-insensitive) identifying transient infrastructure
            # failures of `cargo codspeed run` that are safe to retry.
            # Anything else fails fast, so a real benchmark regression
            # always fails the gate. Kept on one line: YAML folding would
            # inject spaces that break matches at the start of a log line.
            # Numeric codes and TLS keywords are scoped to failure contexts
            # so benchmark timing output (e.g. `1.503 ms`) can't
            # false-positive into a retry.
            TRANSIENT_ERROR_PATTERNS: "connection (timed out|refused|reset)|network is unreachable|temporary failure in name resolution|failed to download|failed to fetch|could not download|curl: \\([0-9]+\\)|(rustls|TLS|SSL|certificate).{0,40}(fail|error|verif|expir|handshake|unable|invalid|timed out|reset|revok)|handshake failure|HTTP/?[0-9](\\.[0-9])? [45][0-9][0-9]|(status|error|code)[^0-9]{0,8}(429|502|503|504)|lost communication with the server|the runner has received a shutdown signal|no space left on device|upload.*(failed|timed out)"
        with:
          # Simulation mode: deterministic CPU simulation, <1% variance,
          # automatic flamegraphs. Best for the CPU-bound Rust core.
          mode: simulation
          # The `codspeed-criterion-compat` shim is injected here (online CI
          # only) by renaming it to `criterion`, so the existing criterion
          # benchmark compiles against the instrumented shim. It is intentionally
          # NOT a permanent dependency in Cargo.toml: doing so breaks offline
          # local builds (crates.io is unreachable in the dev sandbox), which would
          # block `./gradlew :app:testDebugUnitTest` from assembling the Rust .so.
          # `cargo codspeed run` (not plain `cargo bench`) is required so the
          # shim runs under the instrumented harness that defines
          # CODSPEED_CARGO_WORKSPACE_ROOT.
          # Pinned to major v5 to match the cargo-codspeed CLI and CodSpeed runner
          # versions. The compat shim falls back to running as plain Criterion when
          # the CodSpeed runner is unavailable (e.g. local builds, or automation
          # PRs where `id-token: write` is stripped).
          run: |
            cargo remove criterion --dev -p hesabyar-core
            cargo add codspeed-criterion-compat@5 --rename criterion --dev -p hesabyar-core
            cargo codspeed build -p hesabyar-core -m simulation
            # Retry ONLY transient infrastructure failures (network, TLS,
            # HTTP, runner). Each failure is classified by grepping the
            # attempt log: deterministic benchmark/harness failures fail
            # fast, so a later pass can never hide an earlier failure from
            # the merge gate. A per-attempt timeout (exit 124) is retried on
            # attempts 1-2, since a slow runner is indistinguishable from
            # a hang.
            for attempt in 1 2 3; do
              echo "Benchmark run attempt $attempt/3"
              # Bound each attempt: a healthy run finishes well inside 30m.
              # A 124 (timeout) is retried on attempts 1-2; only the final
              # attempt's 124 fails the gate.
              rc=0
              timeout -k 2m 30m cargo codspeed run -p hesabyar-core \
                >"$RUNNER_TEMP/codspeed-attempt.log" 2>&1 || rc=$?
              cat "$RUNNER_TEMP/codspeed-attempt.log"
              if [ "$rc" -eq 0 ]; then
                echo "Benchmarks completed on attempt $attempt"
                exit 0
              fi
              if [ "$rc" -eq 124 ] && [ "$attempt" -lt 3 ]; then
                # A slow or noisy shared runner can trip the per-attempt cap
                # without hanging; retry it like any other transient failure.
                echo "::warning::Benchmark attempt $attempt exceeded the 30m per-attempt budget (exit code $rc) - retrying"
              elif [ "$rc" -eq 124 ]; then
                echo "::error::Benchmark attempt $attempt exceeded the 30m per-attempt budget on the final attempt"
                exit 1
              elif grep -Ei -q "$TRANSIENT_ERROR_PATTERNS" "$RUNNER_TEMP/codspeed-attempt.log"; then
                echo "::warning::Transient infrastructure error on attempt $attempt (exit code $rc) - retrying"
              else
                echo "::error::Non-transient benchmark/harness failure on attempt $attempt (exit code $rc) - failing without retry"
                exit 1
              fi
              [ "$attempt" -eq 3 ] && break
              sleep 30
            done
            echo "::error::Benchmark run failed with transient errors on all 3 attempts"
            exit 1
          working-directory: rust

