name: CodSpeed Benchmarks (Rust)

on:
  push:
    branches: [main]
  pull_request:
  # Allow running the benchmarks manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read # required for actions/checkout
  id-token: write # required for OIDC authentication with CodSpeed

jobs:
  benchmarks:
    name: Run Rust benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `id-token: write` (needed for CodSpeed OIDC auth) is stripped by GitHub on
    # pull requests from forked repositories, which would make this job fail.
    # Only run on pushes and same-repo PRs; community-fork PRs skip benchmarking.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install cargo-codspeed
        # cargo-codspeed sets CODSPEED_CARGO_WORKSPACE_ROOT and instruments the
        # shim. Without it, cargo bench panics with the NotPresent env error.
        run: cargo install cargo-codspeed --locked

      - name: Run benchmarks
        uses: CodSpeedHQ/action@f99becdce5e5d51fd556489ebef684f4ecfd6286 # v4
        with:
          # Simulation mode: deterministic CPU simulation, <1% variance,
          # automatic flamegraphs. Best for the CPU-bound Rust core.
          mode: simulation
          # The `codspeed-criterion-compat` shim is injected here (online CI
          # only) by renaming it to `criterion`, so the existing criterion
          # benchmark compiles against the instrumented shim. It is intentionally
          # NOT a permanent dependency in Cargo.toml: doing so breaks offline
          # local builds (crates.io is unreachable in the dev sandbox), which would
          # block `./gradlew :app:testDebugUnitTest` from assembling the Rust .so.
          # `cargo codspeed run` (not plain `cargo bench`) is required so the
          # shim runs under the instrumented harness that defines
          # CODSPEED_CARGO_WORKSPACE_ROOT.
          run: |
            cargo remove criterion --dev -p hesabyar-core
            cargo add codspeed-criterion-compat@2 --rename criterion --dev -p hesabyar-core
            cargo codspeed run -p hesabyar-core
          working-directory: rust
