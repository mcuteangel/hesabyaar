# Unit tests for the OCR stale-thread audit decision core. Pure node:test;
# no framework, no setup-node needed (ubuntu-latest ships a current Node).
name: OCR Resolver Tests

on:
  push:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/ocr-resolver-tests.yml"
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/ocr-resolver-tests.yml"

permissions:
  contents: read

# Push and pull_request fire for the same commit; cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run OCR resolver tests with coverage
        run: node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=coverage-ocr.lcov .github/scripts/ocr-resolve.test.mjs

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-ocr.lcov
          flags: scripts
          fail_ci_if_error: false

      - name: Upload coverage to Qlty Cloud
        uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
        continue-on-error: true
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage-ocr.lcov
