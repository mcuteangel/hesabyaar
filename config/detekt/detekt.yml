# detekt configuration for Hesabyar
#
# Handwritten Kotlin is linted; auto-generated UniFFI bindings are excluded via
# task-level excludes in build.gradle.kts (rust/uniffi/**, generated/**,
# rust/hesabyar_core.kt). Per-rule excludes below also suppress generated code
# so they remain available to resolve types referenced by handwritten code.

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']

style:
  UnnecessaryParentheses:
    active: true
    excludes:
      - '**/rust/uniffi/**'
      - '**/generated/**'
      - '**/rust/hesabyar_core.kt'
  UtilityClassWithPublicConstructor:
    active: true
    excludes:
      - '**/test/**'

empty-blocks:
  EmptyFunctionBlock:
    excludes:
      - '**/test/**'

complexity:
  CyclomaticComplexMethod:
    active: true
    excludes:
      - '**/rust/uniffi/**'
      - '**/generated/**'
      - '**/rust/hesabyar_core.kt'

# Design-token rules (local ruleset in the detekt-rules module).
# Token-definition files never count as violations: theme, designsystem and
# *Tokens.kt files DEFINE tokens (SpacingTokens, FinancialColors, ...).
# Test sources are not shipped UI, so they are excluded as well.
HesabyarTokens:
  RawColorOutsideTheme:
    active: true
    excludes:
      - '**/ui/theme/**'
      - '**/ui/designsystem/**'
      - '**/*Tokens.kt'
      - '**/test/**'
      - '**/androidTest/**'
  RawDpOutsideTheme:
    active: true
    excludes:
      - '**/ui/theme/**'
      - '**/ui/designsystem/**'
      - '**/*Tokens.kt'
      - '**/test/**'
      - '**/androidTest/**'
      # Pre-existing raw-dp usages, grandfathered until migrated to
      # SpacingTokens; drop an entry once its file is migrated.
      - '**/auth/PinScreen.kt'
      - '**/ui/components/AccountBalanceCard.kt'
      - '**/ui/components/AccountSelector.kt'
      - '**/ui/components/AiResultCard.kt'
      - '**/ui/components/HesabyarButton.kt'
      - '**/ui/components/HesabyarScaffold.kt'
      - '**/ui/components/HesabyarTabRow.kt'
      - '**/ui/components/MarkdownText.kt'
      - '**/ui/screens/AnalyticsScreen.kt'
      - '**/ui/screens/CategoryManagementScreen.kt'
      - '**/ui/screens/CustomTimePickerDialog.kt'
      - '**/ui/screens/DashboardScreen.kt'
      - '**/ui/screens/JalaliDatePickerDialog.kt'
      - '**/ui/screens/PersonDetailSheet.kt'
      - '**/ui/screens/PersonsScreen.kt'
      - '**/ui/screens/ReportsScreen.kt'
      - '**/ui/screens/SettingsScreen.kt'
      - '**/ui/screens/SmartAssistantScreen.kt'
      - '**/ui/screens/account/AccountManagementScreen.kt'
      - '**/ui/screens/dashboard/components/AccountBreakdownCard.kt'
      - '**/ui/screens/dashboard/components/DebtorCreditorCards.kt'
      - '**/ui/screens/dashboard/components/SmartForecastCard.kt'
      - '**/ui/screens/dashboard/components/TransactionMiniItem.kt'
      - '**/ui/screens/dashboard/dialogs/ManualTransactionFormSections.kt'
      - '**/ui/screens/dashboard/dialogs/TransactionDetailDialog.kt'


# Compose rules (io.nlopez.compose.rules:detekt plugin, `Compose` section).
# Pre-existing findings on old UI code, grandfathered per rule from the
# first CI detekt run on b8bd60dd (80 findings across 28 files); drop an
# entry once its file is fixed. New code must pass these rules. Test
# sources are excluded, as with the token rules above.
Compose:
  ComposableNaming:
    active: true
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/ui/screens/BankLoanScreen.kt'
      - '**/ui/screens/dashboard/components/EntranceCard.kt'
